<div class="col-md-12">
  <h4>
    <ol class="breadcrumb mt-2 mb-0 pb-0">
      @for (page of app["_pageStack"]; track page; let currentIndex = $index; let last = $last) {
        <li class="breadcrumb-item {{last ? 'active': ''}}">
          @if (!last) {
            <a href="#" (click)="app.navigateToPage(currentIndex)">{{page.getShortName()}}</a>
            }{{last ? page.getShortName() : ''}}
          </li>
        }
      </ol>
    </h4>
  </div>
