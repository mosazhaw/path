name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.11.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p \"require('./package.json').version\")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Install dependencies
        run: npm ci

      - name: Build release web component
        run: npm run release

      - name: Run unit tests
        run: npm run test:ci

      - name: Check out example application tests
        uses: actions/checkout@v6
        with:
          repository: mosazhaw/path-example-express
          path: example

      - name: Install example application dependencies
        working-directory: example
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: example
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: example
        env:
          CI: true
          PATH_FRAMEWORK_DIR: ${{ github.workspace }}/dist/release
        run: npm run test:e2e

      - name: Publish package
        working-directory: dist/release
        run: npm publish --provenance
