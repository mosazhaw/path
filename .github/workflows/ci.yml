name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.11.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web component
        run: npm run build

      - name: Run unit tests
        run: npm run test:ci

  trigger-integration-tests:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger example application end-to-end tests
        env:
          GH_TOKEN: ${{ secrets.PATH_EXAMPLE_DISPATCH_TOKEN }}
          PATH_SHA: ${{ github.sha }}
        run: |
          PATH_SHORT_SHA="${PATH_SHA:0:7}"
          gh api --method POST repos/mosazhaw/path-example-express/dispatches \
            -f event_type=path-framework-e2e \
            -f "client_payload[path_sha]=${PATH_SHA}" \
            -f "client_payload[path_short_sha]=${PATH_SHORT_SHA}"
