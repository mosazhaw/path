name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check out example application tests
        uses: actions/checkout@v6
        with:
          repository: mosazhaw/path-example-express
          path: example

      - name: Use Node.js 24.11.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build release web component
        run: npm run release

      - name: Run unit tests
        run: npm run test:ci

      - name: Install example application dependencies
        working-directory: example
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: example
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: example
        env:
          CI: true
          PATH_FRAMEWORK_DIR: ${{ github.workspace }}/dist/release
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: example/playwright-report/
          retention-days: 14
